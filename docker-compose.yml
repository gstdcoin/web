services:
  web:
    build: .
    env_file: .env.production
    restart: unless-stopped
    networks:
      - gstd-network
    # Resource limits optimized for 2GB RAM VPS
    deploy:
      resources:
        limits:
          memory: 800M
          cpus: '1.5'
        reservations:
          memory: 400M
          cpus: '0.5'
    # Health check - optimized for quick startup
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Logging with size limits
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    # Security and performance
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  caddy:
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    ports: 
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gstd-network
    # Resource limits optimized for 2GB RAM VPS
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.4'
        reservations:
          memory: 100M
          cpus: '0.2'
    # Health check - optimized for quick startup
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Logging with size limits
    logging:
      driver: "json-file"
      options:
        max-size: "3m"
        max-file: "2"
    # Security
    security_opt:
      - no-new-privileges:true

networks:
  gstd-network:
    driver: bridge

volumes:
  caddy_data: {}
  caddy_config: {}

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Without this, wrangler-action installs its own default (3.90.0),
          # which doesn't read wrangler.jsonc the way OpenNext's config
          # needs and fails with "Missing entry-point". "4" alone resolved
          # to 4.86.0, which hits a Miniflare/workerd internal SQLite crash
          # during `opennextjs-cloudflare deploy`'s getPlatformProxy() call
          # ("table _cf_ALARM has 3 columns but 2 values were supplied").
          # Pin the exact version already proven working in manual deploys.
          wranglerVersion: '4.122.0'

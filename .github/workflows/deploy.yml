name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build for Cloudflare Workers
        # CLOUDFLARE_API_TOKEN/ACCOUNT_ID needed here (not just in the Deploy
        # step below) because of the "ai" binding in wrangler.jsonc --
        # next.config.mjs's initOpenNextCloudflareForDev() runs on every
        # `next build`, and unlike KV/D1/R2, Workers AI can't be emulated
        # locally: it opens a remote proxy session to Cloudflare even at
        # build time, which fails without these.
        run: npx opennextjs-cloudflare build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Pin Wrangler to meet OpenNext 1.20.12's peer requirement for Next 16.4.
          wranglerVersion: '4.148.0'
